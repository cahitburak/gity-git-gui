name: CI

# ADR-006 — all three legs green from the first commit, even when they only
# build a stub. Linux-only development hides Windows and macOS breakage, and
# the longer that goes unnoticed the more expensive it gets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # GCC and Clang both, because they disagree about enough to be worth
        # catching.
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        # Deliberately NOT qt6-base-dev: Ubuntu 24.04 LTS ships Qt 6.4.2, below
        # the 6.8 floor in ADR-001. Qt comes from install-qt-action below, which
        # also matches what we actually ship — the AppImage bundles Qt, so no
        # user ever runs against the distribution's copy.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgit2-dev libgtest-dev googletest \
            libgl1-mesa-dev libglx-dev libegl1-mesa-dev libxkbcommon-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang"   >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc"   >> "$GITHUB_ENV"
            echo "CXX=g++"  >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

  headless-core:
    # The layering rule from ADR-006, enforced rather than documented: core and
    # its tests must build and pass with no Qt in the picture at all.
    name: Core without Qt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (deliberately no Qt at all)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgit2-dev libgtest-dev googletest

      - name: Configure
        run: cmake --preset ci-headless

      - name: Build
        run: cmake --build --preset ci-headless

      - name: Test
        run: ctest --preset ci-headless

  macos:
    name: macOS
    # Billed at 10x. Off by default while a single platform is the target;
    # run it from the Actions tab, or on a release tag, before shipping.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: brew install ninja qt@6 libgit2 googletest

      - name: Configure
        # Native arch only, NOT universal2. A universal binary needs universal
        # dependencies, and Homebrew's libgit2 on an arm64 runner is arm64-only,
        # so the x86_64 slice fails to link. Universal2 belongs in the release
        # pipeline (ADR-007, M7) where libgit2 and its transitive deps are built
        # for both architectures deliberately — it is not something CI can get
        # for free from a package manager.
        run: |
          cmake --preset ci \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

      # ADR-007 — get an empty app through signing and notarization at M0,
      # while it is a five-minute problem rather than a launch blocker.
      # Enable once the Developer ID certificate is in repository secrets.
      - name: Sign, notarize and staple
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          echo "TODO(M0): import cert, macdeployqt, codesign --options runtime,"
          echo "          xcrun notarytool submit --wait, xcrun stapler staple."
          echo "Blocked on the Apple Developer account — see Q4/Q5."
          exit 1

  windows:
    name: Windows
    # Billed at 2x and the slowest leg by far (vcpkg builds libgit2 from
    # source). Same trigger as macOS.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    env:
      # Without a binary cache vcpkg rebuilds libgit2 and OpenSSL from source
      # on every run — 25+ minutes. x-gha stores the built packages in the
      # Actions cache, so only the first run pays that.
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
    steps:
      - uses: actions/checkout@v5

      - uses: ilammy/msvc-dev-cmd@v1

      # vcpkg's ports build with the Ninja generator and the Windows runner
      # does not ship one; without this every port fails with "CMake was unable
      # to find a build program corresponding to Ninja".
      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Expose the Actions cache to vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Bootstrap vcpkg
        # ADR-006 — vcpkg carries libgit2 and gtest here; Qt comes from the
        # step above, never from vcpkg.
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
          echo "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV

      - name: Configure
        run: >
          cmake --preset ci
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci
